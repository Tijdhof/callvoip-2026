{{ define "main" }}

<div class="container space-y-8">
  <form method="get" class="max-w-screen-sm mx-auto" id="pc-form">
    <div class="mb-4"> 
      <label>Postcode <span class="text-red">*</span>
        <input name="zipcheck-zipcode"
          placeholder="Postcode" class="w-full border border-grey-light bg-white px-3 py-2 text-base" required>
      </label>
    </div>
    <div class="mb-4"> 
      <label>Huisnummer <span class="text-red">*</span>
        <input name="zipcheck-housenr"
          placeholder="Huisnummer" class="w-full border border-grey-light bg-white px-3 py-2 text-base" required>
      </label>
    </div>
    <div class="mb-4"> 
      <label>Toevoeging 
        <input name="zipcheck-ext"
          placeholder="Toevoeging" class="w-full border border-grey-light bg-white px-3 py-2 text-base">
      </label>
    </div>
    <button class="bg-blue px-8 py-3 rounded-full text-white">ZOEK</button>
  </form>

  <div class="">
    <div id="pc-loader" class="hidden text-center">Laden...</div>
    <iframe class="w-full" id="pc-result"></iframe>
  </div>
</div>

<script>
  // Updated URL to point to the root domain
  const url = 'https://postcode.callvoip.nl/?'

  const form = document.getElementById('pc-form')
  const iframe = document.getElementById('pc-result')
  const loader = document.getElementById('pc-loader')

  form.onsubmit = function (e) {
    e.preventDefault()

    const formData = new FormData(e.target);
    const params = new URLSearchParams(formData);

    // Show the loading text
    loader.classList.remove('hidden')
    
    // Set the iframe source
    iframe.src = url + params.toString()
  }

  iframe.onload = function (e) {
    // Hide the loading text and expand the iframe once loaded
    loader.classList.add('hidden')
    iframe.style.height = '60rem'
  }

</script>
{{ end }}
