{{ $name := default "Provide input name" (.Get 0) }}
{{ $required := default false (.Get 1) }}

<div class="mb-4">
    <label for="{{ $name | urlize }}" class="block">{{ $name }} {{ if $required}} <span class="text-red">*</span> {{ end }}</label>
    <input type="email" id="{{ $name | urlize }}" name="{{ $name | urlize }}" multiple {{ if $required}} required {{ end }} class="w-full border border-grey-light bg-white px-3 py-2 text-base">
    
    <p class="text-sm text-gray-500 mt-1 text-xs">Meerdere e-mailadressen voor bevestiging? Scheid ze met een komma</p>
</div>
