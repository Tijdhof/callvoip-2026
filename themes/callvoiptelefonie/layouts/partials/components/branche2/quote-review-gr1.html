{{ with .Params.reviewGroup1 }}
<div class="w-full">
  <div class="max-w-screen-xl mx-auto px-4 py-8">
    
    <div class="flex flex-col md:flex-row gap-6 items-stretch">

      {{ range . }}
      <div class="flex-1 flex flex-col justify-between bg-white rounded-xl shadow-sm p-6 border border-gray-100">
        
        <div>
          {{ if .logo }}
          <a href="{{ .logoUrl }}" target="_blank" class="block mb-6 h-16">
            <img src="{{ .logo }}" alt="Bedrijfslogo" class="h-full object-contain object-left">
          </a>
          {{ end }}

          <div class="flex items-start gap-3">
            <div class="font-serif flex-shrink-0" style="font-size: 4rem; line-height: 1; color: #746d69; margin-top: -0.5rem;">“</div>
            
            <div class="flex-grow mb-6">
              <div style="font-size: 1rem; font-weight: 600; font-style: italic; color: #746d69;" class="mb-3">
                {{ .text | markdownify }}
              </div>
              <div style="color: #333333; font-weight: 500; font-size: 0.9rem;">
                — {{ .signer | markdownify }}
              </div>
            </div>
          </div>
        </div>

        {{ if .ctaText }}
        <div class="mt-auto pt-4 border-t border-gray-200">
          <a href="{{ .ctaUrl }}" class="inline-block px-5 py-2.5 bg-[#746d69] text-white text-sm font-semibold rounded hover:bg-opacity-90 transition-colors">
            {{ .ctaText }}
          </a>
        </div>
        {{ end }}

      </div>
      {{ end }}

    </div>
  </div>
</div>
{{ end }}
